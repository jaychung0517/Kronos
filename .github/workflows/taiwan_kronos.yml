
name: Kronos Base - Taiwan Markets

on:
  workflow_dispatch:

  schedule:
    # 16:30 Taiwan time, Monday to Friday
    - cron: "30 8 * * 1-5"

permissions:
  contents: read

concurrency:
  group: kronos-taiwan
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kronos dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance requests matplotlib

      - name: Verify environment
        run: |
          python --version
          python -c "import torch; print(torch.__version__)"
          python -c "from model import Kronos, KronosTokenizer, KronosPredictor; print('Kronos OK')"

      - name: Run Taiwan forecast
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          OMP_NUM_THREADS: "2"
        run: |
          python scripts/taiwan_forecast.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-taiwan-results
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
