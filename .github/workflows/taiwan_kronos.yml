name: Kronos Base - Taiwan Markets

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Which daily session to run"
        required: true
        type: choice
        default: tw_close
        options:
          - tw_close
          - us_close
      mode:
        description: "Live or historical Taiwan backtest"
        required: true
        type: choice
        default: live
        options:
          - live
          - backtest
      scenarios:
        description: "Taiwan model scenarios"
        required: true
        type: choice
        default: AB
        options:
          - AB
          - ABCD
      seed_count:
        description: "Taiwan backtest seeds (US-close always 3)"
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "3"
          - "5"
      backtest_days:
        description: "Historical backtest origins (1-100)"
        required: true
        type: number
        default: 20

  #schedule:
    # Taiwan Monday-Friday 17:10 (UTC Monday-Friday 09:10)
    #- cron: "10 9 * * 1-5"
    # Taiwan Tuesday-Saturday 06:20 (UTC Monday-Friday 22:20)
    # Same hour year-round despite US daylight saving time.
    #- cron: "20 22 * * 1-5"

permissions:
  contents: read
  actions: read  # Fetch the latest finished Taiwan-close report for US-close comparison

concurrency:
  group: kronos-${{ github.event_name == 'schedule' && github.event.schedule == '20 22 * * 1-5' && 'us-close' || 'tw-close' }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KRONOS_SESSION: ${{ (github.event_name == 'schedule' && github.event.schedule == '20 22 * * 1-5') && 'us_close' || (github.event_name == 'workflow_dispatch' && inputs.session == 'us_close' && inputs.mode == 'live') && 'us_close' || 'tw_close' }}
      KRONOS_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'live' }}
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/taiwan_forecast.py
          python -m py_compile scripts/us_close_forecast.py
          python -m py_compile scripts/kronos_daily_report.py
          python -m py_compile tests/test_taiwan_experiments.py

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kronos dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance requests matplotlib pandas_market_calendars

      - name: Verify environment
        run: |
          python --version
          python -c "import torch; print(torch.__version__)"
          python -c "from model import Kronos, KronosTokenizer, KronosPredictor; print('Kronos OK')"

      - name: Run offline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_taiwan_experiments.py' \
            -v

      - name: Install Chinese report fonts
        if: ${{ env.KRONOS_MODE == 'live' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Kronos V3.3 Taiwan or V3.4 US close
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TELEGRAM: "1"
          KRONOS_MODEL: NeoQuasar/Kronos-base
          KRONOS_SCENARIOS: ${{ inputs.scenarios || 'AB' }}
          KRONOS_SEED_COUNT: ${{ github.event_name == 'schedule' && '1' || inputs.seed_count || '1' }}
          V33_LIVE_SEEDS: "3"
          BACKTEST_DAYS: ${{ inputs.backtest_days || '20' }}
          KRONOS_SEED: "20261104"
          MAX_BACKTEST_CALLS: "2500"
          STRICT_TRADING_CALENDAR: "0"
        run: |
          if [[ "${KRONOS_SESSION}" == "us_close" && "${KRONOS_MODE}" == "live" ]]; then
            python -m scripts.us_close_forecast
          else
            python -m scripts.taiwan_forecast
          fi

      - name: Build and send Taiwan-close report
        if: ${{ success() && env.KRONOS_SESSION == 'tw_close' && env.KRONOS_MODE == 'live' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TELEGRAM: "1"
        run: |
          python -m scripts.kronos_daily_report

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KRONOS_SESSION == 'us_close' && 'kronos-us-close-results' || 'kronos-taiwan-v3-results' }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
