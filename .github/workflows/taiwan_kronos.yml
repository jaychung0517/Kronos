
name: Kronos Base - Taiwan Markets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        type: choice
        default: backtest
        options:
          - live
          - backtest

      scenarios:
        description: "Model scenarios"
        required: true
        type: choice
        default: AB
        options:
          - AB
          - ABCD

      seed_count:
        description: "Random seeds (live uses first seed)"
        required: true
        type: choice
        default: "3"
        options:
          - "1"
          - "3"
          - "5"

      backtest_days:
        description: "Historical backtest origins (1-100)"
        required: true
        type: number
        default: 20

  schedule:
    # UTC 09:10 = Taiwan 17:10
    - cron: "10 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: kronos-taiwan
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/taiwan_forecast.py
          python -m py_compile tests/test_taiwan_experiments.py

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kronos dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance requests matplotlib

      - name: Verify environment
        run: |
          python --version
          python -c "import torch; print(torch.__version__)"
          python -c "from model import Kronos, KronosTokenizer, KronosPredictor; print('Kronos OK')"

      - name: Run offline tests
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_taiwan_experiments.py' \
            -v

      - name: Run Kronos V3.2
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          KRONOS_MODEL: NeoQuasar/Kronos-base
          KRONOS_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'live' }}
          KRONOS_SCENARIOS: ${{ inputs.scenarios || 'AB' }}
          KRONOS_SEED_COUNT: ${{ github.event_name == 'schedule' && '1' || inputs.seed_count || '1' }}
          BACKTEST_DAYS: ${{ inputs.backtest_days || '20' }}
          KRONOS_SEED: "20261104"
          MAX_BACKTEST_CALLS: "2500"
          OMP_NUM_THREADS: "2"
          PYTHONUNBUFFERED: "1"
          STRICT_TRADING_CALENDAR: "0"
        run: |
          python -m scripts.taiwan_forecast


      - name: Install Chinese report fonts
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'live' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Build and send daily report
        if: ${{ success() && (github.event_name == 'schedule' || inputs.mode == 'live') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TELEGRAM: "1"
        run: |
          python -m scripts.kronos_daily_report

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-taiwan-v3-results
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
