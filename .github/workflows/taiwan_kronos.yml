name: Kronos Base - Taiwan Markets

on:
  workflow_dispatch:

  schedule:
    # 09:10 UTC = Taiwan 17:10; allows FinMind post-close update buffer.
    - cron: "10 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: kronos-taiwan
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/taiwan_forecast.py tests/test_taiwan_experiments.py

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Kronos dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance requests matplotlib

      - name: Check imports and environment
        run: |
          python --version
          python -c "import torch; print('Torch:', torch.__version__)"
          python -c "from model import Kronos, KronosTokenizer, KronosPredictor; print('Kronos import OK')"

      - name: Run offline unit tests
        run: |
          python -m unittest discover -s tests -p 'test_taiwan_experiments.py' -v

      - name: Run Taiwan 4-scenario forecast
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          KRONOS_MODEL: NeoQuasar/Kronos-base
          KRONOS_SEED: "20261104"
          OMP_NUM_THREADS: "2"
          PYTHONUNBUFFERED: "1"
          # Set to "1" only when data/trading_calendar.csv is maintained.
          STRICT_TRADING_CALENDAR: "0"
        run: |
          python -m scripts.taiwan_forecast

      - name: Upload all results even if prediction failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-taiwan-v2-results
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
